name: Playlist yoxla və yenilə

on:
  schedule:
    # Nə vaxt avtomatik işləsin. Vaxt UTC-dir, Bakı = UTC+4.
    # "0 3,9,15 * * *" = Bakı 07:00, 13:00, 19:00 (gündə 3 dəfə).
    # Tez-tez etsən: ölü kanal tez təmizlənir, amma GitHub limiti tez bitir. Az etsən: ölü kanal uzun qalır.
    - cron: "0 3,9,15 * * *"
  workflow_dispatch:          # Qalsa: Actions tabında "Run workflow" düyməsi ilə əl ilə işə sala bilərsən. Silsən: düymə yox olur.
  push:                       # Qalsa: aşağıdakı fayllar dəyişəndə dərhal işə düşür. Silsən: yalnız cədvəllə (və ya əl ilə) işləyir.
    paths:
      - "sources.txt"
      - "config.json"
      - "backup/**"

permissions:
  contents: write   # Bot playlist-i yeniləyə bilsin deyə lazımdır. Silsən: bot commit edə bilməz, xəta verir.

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 30 dəqiqədən çox çəksə dayandırılır. Azaltsan: böyük siyahıda yarımçıq kəsilə bilər.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Yoxla və əvəz et
        run: python scripts/checker.py

      - name: Dəyişiklik varsa commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Dəyişiklik yoxdur"
          else
            git commit -m "auto: playlist yeniləndi $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
